# Canonical DPYC commit-phase CI. dpyc-community is config + Python scripts (no package),
# so it installs the tools directly rather than `pip install -e .[dev]`. The `test` job posts
# a version-independent status context `test` — NOT `test (3.12)`: a required-check name pinned
# to a matrix cell orphans the moment the matrix moves, jamming merges (see require_ci_checks.py).
# Lints the scripts + tests and runs the doctrine_lint suite — including the "don't turn yourself
# off" invariant tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff pytest pyyaml pynostr

      - name: Lint
        run: ruff check scripts/ tests/ docs/model/

      - name: Run tests
        run: pytest tests/ -v

  # The architecture model in docs/model is only worth having if it stays true, so its
  # checks run here rather than on someone's laptop.
  #
  # This job ALWAYS runs, and deliberately does not use a `paths:` filter. A path-filtered
  # workflow posts no status on PRs that miss the filter, and a required context that
  # sometimes never posts leaves merges pending forever — the exact trap
  # scripts/require_ci_checks.py refuses to walk into. So the job always reports, and skips
  # its own expensive steps when docs/model is untouched. That keeps `model` safe to add to
  # branch protection.
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Same base/head SHA idiom as doctrine-lint.yml. On push to main there is no PR to
      # diff against, so everything runs.
      - name: Did the model change?
        id: touched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "push build — running every model check."
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "flows=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")
          if grep -q '^docs/model/' <<<"$changed"; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "docs/model untouched — reporting green without running the checks."
          fi
          # Tracked SEPARATELY from the model checks, because the workflow graph is a
          # different artifact with a different diff. Gating the workflow check on
          # `docs/model/` would have skipped the very PR that broke deploy-verify — a
          # workflow-only change — which is the whole failure this check exists to catch.
          if grep -qE '^(\.github/workflows/|scripts/factory-callers/)' <<<"$changed"; then
            echo "flows=true" >> "$GITHUB_OUTPUT"
          else
            echo "flows=false" >> "$GITHUB_OUTPUT"
            echo "no workflow files touched — skipping the workflow-graph check."
          fi

      - uses: actions/setup-python@v6
        if: steps.touched.outputs.any == 'true' || steps.touched.outputs.flows == 'true'
        with:
          python-version: '3.12'

      # Runs before the SysML checks: a workflow that cannot start is a defect in the
      # factory's behavior even when the model describing it is perfectly well-formed.
      - name: Workflow graph starts
        if: steps.touched.outputs.flows == 'true'
        run: |
          pip install --quiet pyyaml
          python3 docs/model/check_workflows.py --verbose

      # For each state, do the events the outside world can deliver at any moment have a
      # transition? An unhandled one must carry a written reason, not sit on an allow-list.
      - name: State-machine completeness
        if: steps.touched.outputs.any == 'true'
        run: python3 docs/model/check_states.py --verbose

      # factory-model.html is generated and committed. Regenerate and diff, so editing a
      # source without rebuilding the page cannot land — the page would otherwise rot
      # silently against the model it claims to render.
      - name: The published page is current
        if: steps.touched.outputs.any == 'true'
        run: |
          set -euo pipefail
          python3 docs/model/build_page.py
          if ! git diff --quiet -- docs/model/factory-model.html; then
            echo "::error::docs/model/factory-model.html is stale. Run 'python3 docs/model/build_page.py' and commit the result."
            git diff --stat -- docs/model/factory-model.html
            exit 1
          fi
          echo "Generated page matches its sources."

      - uses: actions/setup-node@v4
        if: steps.touched.outputs.any == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/model/package-lock.json

      # Parses AND renders every mermaid block. Parsing alone is not enough — the two bugs
      # this caught were both grammar-level, but a diagram can also die in layout.
      - name: Diagrams parse and render
        if: steps.touched.outputs.any == 'true'
        working-directory: docs/model
        run: |
          npm ci
          node check.mjs
