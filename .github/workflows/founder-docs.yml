name: Generate Founder Resume

# The markdown is the source of truth; the HTML and PDF are generated. When the
# markdown (or its build inputs) changes on main, regenerate both and open a PR
# with the fresh artifacts — same regenerate-then-PR pattern as patent-pdfs.yml,
# never a direct push to main.

on:
  push:
    branches: [main]
    paths:
      - "docs/founder/LonnieVanZandt_2026.md"
      - "docs/founder/template.html"
      - "docs/founder/build.sh"

permissions:
  contents: write
  pull-requests: write

jobs:
  build-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pandoc and xelatex
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra fonts-lmodern

      - name: Regenerate HTML and PDF from the markdown source
        run: bash docs/founder/build.sh

      - name: Open PR with regenerated resume artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/founder/LonnieVanZandt_2026.html docs/founder/LonnieVanZandt_2026.pdf
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            BRANCH="ci/founder-resume-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "ci: regenerate founder resume html/pdf from markdown"
            git push origin "$BRANCH"
            gh pr create \
              --title "ci: regenerate founder resume" \
              --body "Auto-generated from docs/founder/LonnieVanZandt_2026.md changes on main." \
              --base main \
              --head "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
