name: Generate Founder Resume

# The markdown is the single source of truth. When it (or its build inputs)
# changes on main, re-render both artifacts inside a container — so no runner
# nor workstation needs a pandoc/TeX toolchain — and commit them straight back
# to main as the factory App, which is a bypass actor on the branch ruleset.
# The commit touches only the generated files (never the .md), so the path
# filter below does not re-trigger this workflow: no loop.

on:
  workflow_dispatch:        # manual re-render, e.g. after changing the render flags
  push:
    branches: [main]
    paths:
      - "docs/founder/LonnieVanZandt_2026.md"
      - "docs/founder/template.html"
      - "factory/actions/render-founder-resume/action.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Mint the factory App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DPYC_BOT_APP_ID }}
          private-key: ${{ secrets.DPYC_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Render html and pdf
        uses: ./factory/actions/render-founder-resume

      - name: Commit regenerated artifacts to main
        run: |
          git config user.name "dpyc-agentic-desk[bot]"
          git config user.email "304711879+dpyc-agentic-desk[bot]@users.noreply.github.com"
          git add docs/founder/LonnieVanZandt_2026.html docs/founder/LonnieVanZandt_2026.pdf
          if git diff --cached --quiet; then
            echo "Artifacts already current — nothing to commit."
            exit 0
          fi
          git commit -m "ci: render founder resume html/pdf from markdown [skip ci]"
          # Rebase onto the current tip so a manual dispatch — or a run whose base
          # moved during the job — still lands as a fast-forward rather than being
          # rejected as non-fast-forward.
          git fetch origin main -q
          git rebase origin/main
          git push origin HEAD:main
