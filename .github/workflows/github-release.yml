# DPYC GitHub Release (reusable) — cut a Release whose body is the CHANGELOG section.
#
# Called by a thin per-repo `release.yml` on a `v*` tag push. Every DPYC repo wants exactly
# this and nothing more, so it takes no inputs: CHANGELOG.md at the repo root, title = the
# tag name.
#
# This exists because the same 40 lines were pasted into 18 repos as 8 divergent copies, and
# the extractor drifted into two generations. Both generations shipped silent failures:
#
#   - The bracket-only form `/^## \[$VERSION\]/` matched nothing once a CHANGELOG used the
#     "## 1.2.3 — date" style, so every release published the bare "Release X.Y.Z" fallback
#     and none of the prose ever reached the release page.
#   - The successor's exit pattern `/^## [[]?[0-9]/` required a DIGIT, so it never stopped at
#     `## [Unreleased]` and ran on to the next numeric heading, swallowing the backlog in
#     between. roastify-mcp published 339 lines where 8 were meant.
#
# Fixing one repo never fixed the fleet. That is the whole reason this file is here.
name: DPYC GitHub Release (reusable)

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eo pipefail
          VERSION="${TAG#v}"

          # START matches EITHER heading style — "## [1.2.3]" or "## 1.2.3 — date".
          # Dots are escaped so 1.2.3 cannot match a heading like "1x2x3", and the
          # bracket-expression form ([[] / []]) is portable across mawk, gawk and BSD awk.
          #
          # EXIT is any next "## " heading, NOT just a numeric one. Every section boundary is
          # a "## ", and requiring a digit is precisely what let `## [Unreleased]` through.
          VERSION_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          NOTES=$(awk "/^## [[]?${VERSION_RE}[]]?([ ]|\$)/{found=1; next} /^## /{if(found) exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            # Deliberately non-fatal: a pushed tag must never be left without a Release.
            # But say so, because this silently produced one-line releases for months.
            echo "::warning title=No CHANGELOG section::No section for '${VERSION}'. Expected '## [${VERSION}]' or '## ${VERSION} — <date>'. Headings found: $(grep -m10 -E '^## ' CHANGELOG.md | tr '\n' ' ')"
            NOTES="Release $VERSION"
          fi

          # Write to a file to preserve newlines.
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          echo "Release notes: $(wc -l < "$RUNNER_TEMP/release-notes.md") lines"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
