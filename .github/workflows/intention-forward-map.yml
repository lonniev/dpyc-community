# Intention Service — forward-map harvester (Task 2). Central + deterministic (no LLM).
#
# Writes only the DERIVED forward map — Services + per-service keyword Capabilities — into
# the cypher-mcp factory graph through the published, parameterized templates (never raw
# Cypher). It signs as the JOURNEYMAN, using the factory's OWN agent key. It never touches
# any other operator's nsec.
#
# DRY: there is no committed capabilities/patent mirror YAML. Patent element nodes are
# parsed straight from the committed docs/patent/REFERENCE-NUMERAL-SCHEDULE.md (`--mode
# patent`, Journeyman-signed, structural). The AUTHORED pass — the human-authored `why` and
# the Invariants — writes provenance 'human-authored', is gated to the cypher graph owner's
# key, and is run occasionally BY that human from a secure file, driven by a TRANSIENT,
# uncommitted manifest (--manifest), never in shared CI:
#
#     OPERATOR_NSEC="$(cat <secure-file>)" \
#       python scripts/intention_harvest.py --mode authored --manifest <scratch>.yaml \
#         --operator-npub npub1... --url https://cypher-mcp.fastmcp.app/mcp
#
# Keeping the operator key out of shared CI is the point: no domain holds another operator's
# nsec on a recurring basis.
name: Intention Forward Map

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Optional canonical slug (e.g. excalibur-mcp) to harvest alone; empty = full sweep."
        type: string
        default: ""
  # Called by deploy-verify.yml once an operator's live service is confirmed to be
  # serving the new sha. A merge changes `main`; it does NOT change the projection,
  # because the derived map is probed from the RUNNING tool surface. Deploy is the
  # moment the projection actually moved, so that is when we re-read it.
  workflow_call:
    inputs:
      service:
        description: "The canonical slug that just redeployed. Scopes the probe to that one service."
        type: string
        default: ""
    secrets:
      JOURNEYMAN_NSEC:
        required: false
  schedule:
    # The safety net, deliberately kept: it catches a service whose surface changed
    # without a deploy-verify (a manual push, a rollback, a registry edit) and any
    # deploy-triggered run that failed to reach a cold service.
    - cron: "23 5 * * 1"   # weekly, Mondays ~05:23 UTC

permissions:
  contents: read

concurrency:
  # Per-service, so two operators deploying at once do not serialize behind each other,
  # while a full sweep still cannot overlap itself. never cancel-in-progress: a half-applied
  # write plan is worse than a slow one.
  group: intention-forward-map-${{ inputs.service || 'all' }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    # Job-level env so the guard below (a step `if`) can see whether the identity exists.
    # Only the Journeyman's OWN key — no other operator's nsec is ever placed here. That
    # secret is already set fleet-wide by scripts/bootstrap-factory-secrets.sh; the npub is
    # DERIVED from it and CYPHER_MCP_URL defaults in the script — so nothing else to configure.
    env:
      JOURNEYMAN_NSEC: ${{ secrets.JOURNEYMAN_NSEC }}
    steps:
      # ALWAYS check out dpyc-community — this workflow's own repo, where the harvest
      # script and members/ registry live. In a reusable workflow `actions/checkout`
      # defaults to the CALLER's repository, so a deploy-triggered run from an operator
      # repo checked that out instead and could not find scripts/intention_harvest.py.
      # It worked on `schedule` only because caller and host are the same repo there.
      #
      # Native runs (schedule / dispatch) keep taking the current sha, so a branch can
      # still be tested; an external caller pins main, which is the logic on record.
      - uses: actions/checkout@v4
        with:
          repository: lonniev/dpyc-community
          ref: >-
            ${{ github.repository == 'lonniev/dpyc-community' && github.sha || 'main' }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet pyyaml fastmcp tollbooth-dpyc

      - name: Preview plan (always)
        run: |
          python scripts/intention_harvest.py --mode derived --dry-run \
            ${SERVICE:+--service "$SERVICE"}
        env:
          SERVICE: ${{ inputs.service }}

      - name: Harvest the derived forward map
        # Skipped unless the Journeyman identity is configured — keeps the scheduled run
        # green before the secret/var are in place.
        if: ${{ env.JOURNEYMAN_NSEC != '' }}
        run: |
          python scripts/intention_harvest.py --mode derived \
            ${SERVICE:+--service "$SERVICE"}
        env:
          SERVICE: ${{ inputs.service }}
