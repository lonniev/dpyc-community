# DPYC Surveyor — fleet-wide DRY / elegance audit, hub-resident.
#
# Fires (via the hub caller) on a SCHEDULE. DRY defects are inherently CROSS-REPO — a
# consumer reimplementing a `tollbooth-dpyc` primitive, or the same logic echoed across
# operators — so no single-repo role can see them. The Surveyor clones the fleet
# READ-ONLY, consults the Cypher intention graph for the authored DRY boundaries, and
# files one plain `audit/dry` issue per finding into the repo that should change. Porter
# then triages what it files; it never applies `agent/fix` itself.
#
# It cannot write code anywhere. Two owner-wide App tokens, each already proven elsewhere:
#   - a contents:READ-ONLY token wired into git's global auth header (the pr-dialogue.yml
#     discipline) — used ONLY to clone siblings, and kept OUT of the agent's environment;
#   - an issues:WRITE token (the escalation.yml cross-repo-writer scope) as GH_TOKEN, so
#     the agent can file into any fleet repo but can never touch code, PRs, or workflows.
# allowedTools is read + enumerated `gh issue`/`gh label` subcommands only — no merge,
# approve, edit, or push — so even a successful injection from a code/issue body cannot
# land code or unlock a gate.
name: DPYC Surveyor (reusable)

on:
  workflow_call:
    inputs:
      model:
        description: Claude model tier for the survey (reader tier).
        type: string
        default: claude-sonnet-5
      ref:
        description: dpyc-community ref to fetch the Surveyor prompt from.
        type: string
        default: main
      repos:
        description: >-
          Space-separated fleet repos to survey (owner implicit). Empty = the full
          canonical fleet (resolved in the render step, the single source of truth).
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      DPYC_BOT_APP_ID:
        required: true
      DPYC_BOT_PRIVATE_KEY:
        required: true
      PORTER_NSEC:
        required: true

permissions:
  contents: read
  issues: write

# One survey at a time — a fleet sweep is global, so the group is the workflow. An
# overlapping sweep would double-file the same cross-repo finding.
concurrency:
  group: dpyc-surveyor
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Investigation token — every repo the App is installed on, but contents:READ ONLY.
      # If leaked it can only read code (never write anything), and App tokens expire in ~1h.
      - name: Mint the read-only clone token (owner-wide)
        id: read_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DPYC_BOT_APP_ID }}
          private-key: ${{ secrets.DPYC_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-metadata: read

      # Teach git to authenticate github.com clones with the read-only token via a GLOBAL
      # auth header — so `git clone https://github.com/<owner>/<repo>` just works, tokenlessly,
      # and the token is NOT copied into each clone's local config nor exposed in the agent's
      # environment (the nsec-isolation discipline).
      - name: Enable read-only cloning of sibling repos
        env:
          READ_TOKEN: ${{ steps.read_token.outputs.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$READ_TOKEN" | base64 | tr -d '\n')
          git config --global "http.https://github.com/${{ github.repository_owner }}/.extraheader" "AUTHORIZATION: basic ${AUTH}"
          mkdir -p siblings

      # Filing token — account-wide but ONLY issues:write (the escalation.yml scope): it can
      # open issues in any fleet repo and touch nothing else. This is the agent's GH_TOKEN.
      - name: Mint the issues-only filing token (owner-wide)
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DPYC_BOT_APP_ID }}
          private-key: ${{ secrets.DPYC_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write
          permission-metadata: read

      # The Surveyor's signing hand (Porter's reader identity): queries the intention graph
      # for the DRY boundaries. The nsec lives only in the keyring subprocess's env below.
      - name: Install the agent keyring
        run: python -m pip install --quiet "tollbooth-dpyc[keyring]==0.63.1"

      # The Surveyor's behavior lives in factory/surveyor.prompt.md (agent may evolve it via
      # PR; this skeleton — schedule, tokens, tools — stays human-only). Fill only OWNER / REPOS.
      - name: Render the Surveyor prompt
        id: prompt
        env:
          OWNER: ${{ github.repository_owner }}
          REPOS: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          # Canonical fleet — the single source of truth. Empty input (the scheduled path;
          # workflow_dispatch defaults are also empty on non-dispatch events) means "all".
          # Swift (pricing-studio, tollbooth-pricing-studio) and docs (network-states) are
          # excluded: the SDK primitives this audit reasons about are Python.
          if [ -z "${REPOS// }" ]; then
            REPOS="tollbooth-dpyc schwab-mcp thebrain-mcp excalibur-mcp cypher-mcp optionality-mcp taxsort-mcp roastify-mcp tollbooth-authority tollbooth-authority-newengland tollbooth-authority-northamerica tollbooth-wasmcp tollbooth-fermyon dpyc-oracle tollbooth-sample tollbooth-oauth2-collector tollbooth-shortlinks"
          fi
          export REPOS
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/lonniev/dpyc-community/${{ inputs.ref }}/factory/surveyor.prompt.md" \
            -o /tmp/surveyor.prompt.md
          rendered=$(envsubst '${OWNER} ${REPOS}' < /tmp/surveyor.prompt.md)
          { echo 'text<<PROMPT_EOF'; echo "$rendered"; echo 'PROMPT_EOF'; } >> "$GITHUB_OUTPUT"

      # Unbreak the agent bash sandbox: a runner-image change left bwrap's HOME at
      # /home (not /home/runner), so it can't create /home/.mcp.json and every agent
      # Bash command dies. Make /home writable + seed the file. Linux-only.
      - name: Unbreak the agent bash sandbox (bwrap /home/.mcp.json)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo chmod 0777 /home
          sudo touch /home/.mcp.json && sudo chmod 0666 /home/.mcp.json

      - name: Resolve the model tier
        id: model
        uses: lonniev/dpyc-community/factory/actions/resolve-model@main
        with:
          tier: ${{ inputs.model }}

      - name: Survey the fleet for DRY and elegance
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # The Factory routes through OpenRouter. ANTHROPIC_API_KEY carries the OpenRouter
          # key: its Anthropic-compatible endpoint reads x-api-key, the header this variable
          # produces, so the secret NAME stays put and only its value changed.
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.token.outputs.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ steps.model.outputs.slug }}
            --max-turns 60
            --mcp-config '{"mcpServers":{"graph":{"type":"stdio","command":"python","args":["-m","tollbooth.agent_keyring"],"env":{"DPYC_KEYRING_UPSTREAM":"https://cypher-mcp.fastmcp.app/mcp","DPYC_KEYRING_NPUB":"npub1ymgfh46ace33zgld5zdc7gyhc5keyu42v36td0q7c44ks45d79eslwe2q2","DPYC_KEYRING_NSEC":"${{ secrets.PORTER_NSEC }}"}}}}'
            --allowedTools "Read,Grep,Glob,Bash(git clone:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh label create:*),mcp__graph__cypher_list_capabilities,mcp__graph__cypher_which_service_handles,mcp__graph__cypher_explain_capability"
