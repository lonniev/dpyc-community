name: Validate Relays Registry

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'relays.json'
      - 'schemas/relays.schema.json'
  push:
    branches: [main]
    paths:
      - 'relays.json'
      - 'schemas/relays.schema.json'

permissions:
  contents: read

jobs:
  # Named `relays`, not `validate` — see the note in validate-members.yml.
  relays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate relays.json against schema
        run: python scripts/validate_relays.py
