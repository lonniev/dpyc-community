# Model-tier resolver — DETERMINISTIC, no LLM.
#
# The Factory routes through OpenRouter, whose model names are provider-scoped
# slugs (`x-ai/grok-4.5`), not Anthropic bare names (`claude-opus-4-8`). Rather
# than rewrite ~96 `with: model:` call sites across 18 caller repos, the callers
# keep sending TIER ALIASES and this action resolves an alias to whatever slug
# the tier currently points at.
#
# So this file is the fleet's single model-routing decision. Changing a tier —
# or rolling the whole Factory back to direct Anthropic — is an edit HERE, and
# every role in every repo follows on its next run.
#
# The rule is cost minimisation without loss of quality. A tier is the cheapest
# route measured to still produce an acceptable artifact for its roles — nothing
# here is required to be free, and price alone never decides.
#
# Current tiers (prices per million tokens, in/out, as listed by OpenRouter):
#
#   writer  — Journeyman, PR-Revision. Writes code, so it gets the stronger tier.
#             x-ai/grok-4.5              $2 / $6      (was anthropic/claude-opus-4.8  $5 / $25)
#   reader  — Porter, QA, Housekeeper, PR-Dialogue. Reads, judges, reports.
#             x-ai/grok-4.3              $1.25 / $2.50 (was anthropic/claude-sonnet-5 $2 / $10)
#   budget  — Digest only. Cheapest route measured to still do the job.
#             nvidia/nemotron-3-ultra-550b-a55b:free
#
# The budget route is NOT free, despite the `:free` suffix. Its first real run — a
# 67-turn fleet sweep — billed $0.1155, against roughly $1 for the same work on the
# reader tier. Nine times cheaper for an artifact that was fit for purpose, which is
# why it stays; but a `:free` slug only means "prefer the free pool", and OpenRouter
# bills the paid variant when that pool is unavailable. Enforcing zero would need a
# per-request `provider: {allow_fallbacks: false}`, and claude-code-action cannot
# inject marketplace-specific body fields — so the cheapness is best-effort and must
# be verified from the ledger, never assumed from the slug.
#
# Its other cost is latency: 25 minutes wall clock for that sweep, against ~45s for a
# 10-turn reader run. Fine where nobody waits on the result. Disqualifying for triage
# on a fresh issue or a review gating a merge — which is what limits this route to
# Digest, not any property of the model.
#
# ROLLBACK: set WRITER_SLUG to anthropic/claude-opus-4.8 and READER_SLUG to
# anthropic/claude-sonnet-5, and re-run the key rollout with an Anthropic key.
# Nothing else in the fleet has to change.
name: Resolve model tier
description: Map a caller's model tier alias to the provider slug the Factory currently routes to.

inputs:
  tier:
    description: The tier alias a caller passes (e.g. claude-opus-4-8), or an explicit provider slug.
    required: true

outputs:
  slug:
    description: The provider-scoped model slug to hand to claude-code-action.
    value: ${{ steps.map.outputs.slug }}

runs:
  using: composite
  steps:
    - name: Map the tier to a slug
      id: map
      shell: bash
      env:
        TIER: ${{ inputs.tier }}
        WRITER_SLUG: x-ai/grok-4.5
        READER_SLUG: x-ai/grok-4.3
        BUDGET_SLUG: nvidia/nemotron-3-ultra-550b-a55b:free
      run: |
        set -euo pipefail

        # An explicit provider slug passes through untouched, so a single repo can
        # pin a model for one run without waiting on a change to this map.
        case "$TIER" in
          */*) slug="$TIER" ;;
          claude-opus-4-8|claude-opus-4.8|opus|writer)   slug="$WRITER_SLUG" ;;
          claude-sonnet-5|claude-sonnet-5.0|sonnet|reader) slug="$READER_SLUG" ;;
          budget)                                        slug="$BUDGET_SLUG" ;;
          *)
            echo "::error::Unknown model tier '$TIER'. Add it to factory/actions/resolve-model, or pass a provider slug like x-ai/grok-4.5." >&2
            exit 1
            ;;
        esac

        echo "slug=$slug" >> "$GITHUB_OUTPUT"
        echo "Model tier '$TIER' resolves to '$slug'."
